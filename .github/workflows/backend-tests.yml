name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pandora_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pandora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandora_test -d pandora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pandora_test:test-only-password@localhost:5432/pandora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest -q
